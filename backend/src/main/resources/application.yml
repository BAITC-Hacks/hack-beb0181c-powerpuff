server:
  port: 8080

spring:
  application:
    name: backend
  # По умолчанию — H2 в памяти: запускается без установки БД
  datasource:
    url: jdbc:h2:mem:hackdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true   # http://localhost:8080/h2-console

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
