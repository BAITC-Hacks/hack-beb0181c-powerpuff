server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hackdb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/{vendor}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  purchase-terms-file: ${PURCHASE_TERMS_FILE:}
  llm:
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  ml:
    url: ${ML_URL:http://localhost:8000}
  ekt:
    enabled: ${EKT_ENABLED:false}
    base-url: ${EKT_BASE_URL:https://ekt.kz}
    username: ${EKT_USERNAME:}
    password: ${EKT_PASSWORD:}
    connect-timeout: 5s
    read-timeout: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
